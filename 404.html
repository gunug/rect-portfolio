<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found</title>
    <script type="text/javascript">
      // 404 에러 시 URL을 유지하면서 SPA의 인덱스 페이지로 리디렉션
      (function() {
        // 현재 URL의 경로를 가져옵니다.
        var pathName = window.location.pathname;
        
        // '/index.html'을 붙여서 URL을 재구성합니다.
        // 이렇게 하면 웹 서버는 index.html 파일을 반환하지만,
        // 브라우저의 URL 히스토리에는 원래 경로가 유지됩니다.
        window.location.replace(pathName + 'index.html');
      })();
    </script>
  </head>
  <body></body>
</html>
